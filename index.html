      body {

      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 2px;

      .no-scrollbar::-webkit-scrollbar {

      }

        scrollbar-width: none;
      }
